# configuration file /usr/local/openresty/nginx/conf/conf.d/angelcare-admin.dnow.hk.conf:
server {
    listen 80 ; 
    listen 443 ssl ; 
    http2 on; 
    server_name angelcare-admin.dnow.hk; 
    index index.php index.html index.htm default.php default.htm default.html; 
    root /www/sites/angelcare-admin.dnow.hk/index; 
    access_log /www/sites/angelcare-admin.dnow.hk/log/access.log main; 
    error_log /www/sites/angelcare-admin.dnow.hk/log/error.log; 
    # HTTP → HTTPS
    if ($scheme = http) {
        return 301 https://$host$request_uri; 
    }
    error_page 497 https://$host$request_uri; 
    ssl_certificate /www/sites/angelcare-admin.dnow.hk/ssl/fullchain.pem; 
    ssl_certificate_key /www/sites/angelcare-admin.dnow.hk/ssl/privkey.pem; 
    ssl_protocols TLSv1.3 TLSv1.2; 
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED; 
    ssl_prefer_server_ciphers off; 
    ssl_session_cache shared:SSL:10m; 
    ssl_session_timeout 10m; 
    add_header Strict-Transport-Security "max-age=31536000"; 
    proxy_set_header X-Forwarded-Proto https; 
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404; 
    }
    location ^~ /.well-known {
        allow all; 
        root /usr/share/nginx/html; 
    }
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403; 
    }
    # API 反代到 Node
    location /api/ {
        proxy_pass http://127.0.0.1:3000; 
        proxy_http_version 1.1; 
        proxy_set_header Host $host; 
        proxy_set_header X-Real-IP $remote_addr; 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
        proxy_set_header X-Forwarded-Proto $scheme; 
        proxy_set_header X-Forwarded-Host $host; 
        proxy_set_header Upgrade $http_upgrade; 
        proxy_set_header Connection "upgrade"; 
        proxy_connect_timeout 60s; 
        proxy_send_timeout 60s; 
        proxy_read_timeout 60s; 
    }
    # 前端靜態 + SPA
    location / {
        try_files $uri $uri/ /index.html; 
    }
    error_page 404 /404.html; 
}
# configuration file /usr/local/openresty/nginx/conf/conf.d/app.doctornow.hk.conf:
server {
    listen 80 ; 
    listen 443 ssl ; 
    http2 on; 
    server_name app.doctornow.hk; 
    root /www/sites/app.doctornow.hk/index; 
    index index.php index.html index.htm; 
    access_log /www/sites/app.doctornow.hk/log/access.log main; 
    error_log /www/sites/app.doctornow.hk/log/error.log; 
    # SSL
    ssl_certificate /www/sites/app.doctornow.hk/ssl/fullchain.pem; 
    ssl_certificate_key /www/sites/app.doctornow.hk/ssl/privkey.pem; 
    ssl_protocols TLSv1.3 TLSv1.2; 
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED; 
    ssl_prefer_server_ciphers off; 
    ssl_session_cache shared:SSL:10m; 
    ssl_session_timeout 10m; 
    # HTTP → HTTPS
    if ($scheme = http) {
        return 301 https://$host$request_uri; 
    }
    error_page 497 https://$host$request_uri; 
    # Headers
    add_header Strict-Transport-Security "max-age=31536000" always; 
    proxy_set_header Host $host; 
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
    proxy_set_header X-Forwarded-Host $server_name; 
    proxy_set_header X-Real-IP $remote_addr; 
    proxy_set_header X-Forwarded-Proto https; 
    proxy_http_version 1.1; 
    proxy_set_header Upgrade $http_upgrade; 
    proxy_set_header Connection "upgrade"; 
    # 敏感檔
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404; 
    }
    # Let's Encrypt / .well-known（用網站根目錄，不要用預設 html）
    location ^~ /.well-known/ {
        allow all; 
        default_type "text/plain"; 
        try_files $uri =404; 
    }
    # WordPress：用 named location，避免 /index.php 內部導向迴圈
    location / {
        try_files $uri $uri/ @wordpress; 
    }
    location @wordpress {
        rewrite ^ /index.php?$args last; 
    }
    # PHP
    # 靜態快取（可選）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 7d; 
        access_log off; 
        try_files $uri =404; 
    }
    # 不要用會再導向的自訂 404（交給 WordPress）
    # error_page 404 /404.html;
    location ~ [^/]\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000; 
        include fastcgi-php.conf; 
        include fastcgi_params; 
        set $real_script_name $fastcgi_script_name; 
        if ($fastcgi_script_name ~ "^(.+?\.php)(/.+)$" ) {
            set $real_script_name $1; 
            set $path_info $2; 
        }
        fastcgi_param SCRIPT_FILENAME $document_root$real_script_name; 
        fastcgi_param SCRIPT_NAME $real_script_name; 
        fastcgi_param PATH_INFO $path_info; 
    }
}
# configuration file /usr/local/openresty/nginx/conf/fastcgi-php.conf:
# regex to split $uri to $fastcgi_script_name and $fastcgi_path
fastcgi_split_path_info ^(.+\.php)(/.+)$;

# Check that the PHP script exists before passing it
try_files $fastcgi_script_name =404;

# Bypass the fact that try_files resets $fastcgi_path_info
# see: http://trac.nginx.org/nginx/ticket/321
set $path_info $fastcgi_path_info;
#fastcgi_param PATH_INFO $path_info;
fastcgi_read_timeout 3600;

fastcgi_index index.php;

# configuration file /usr/local/openresty/nginx/conf/fastcgi_params:
fastcgi_param  QUERY_STRING       $query_string;
fastcgi_param  REQUEST_METHOD     $request_method;
fastcgi_param  CONTENT_TYPE       $content_type;
fastcgi_param  CONTENT_LENGTH     $content_length;

fastcgi_param  SCRIPT_NAME        $fastcgi_script_name;
fastcgi_param  REQUEST_URI        $request_uri;
fastcgi_param  DOCUMENT_URI       $document_uri;
fastcgi_param  DOCUMENT_ROOT      $document_root;
fastcgi_param  SERVER_PROTOCOL    $server_protocol;
fastcgi_param  REQUEST_SCHEME     $scheme;
fastcgi_param  HTTPS              $https if_not_empty;

fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
fastcgi_param  SERVER_SOFTWARE    nginx;

fastcgi_param  REMOTE_ADDR        $remote_addr;
fastcgi_param  REMOTE_PORT        $remote_port;
fastcgi_param  SERVER_ADDR        $server_addr;
fastcgi_param  SERVER_PORT        $server_port;
fastcgi_param  SERVER_NAME        $server_name;

# PHP only, required if PHP was built with --enable-force-cgi-redirect
fastcgi_param  REDIRECT_STATUS    200;

fastcgi_param  HTTP_HOST          $http_host;
fastcgi_param  HTTP_USER_AGENT    $http_user_agent;
fastcgi_param  HTTP_REFERER       $http_referer;
fastcgi_param  HTTP_COOKIE        $http_cookie;
fastcgi_param  HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
fastcgi_param  PATH_INFO          $fastcgi_path_info;
fastcgi_param  REQUEST_TIME       $msec;
# configuration file /usr/local/openresty/nginx/conf/conf.d/www.cliniquedelight.com.conf:
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name www.cliniquedelight.com cliniquedelight.com;

    root /www/sites/www.cliniquedelight.com/index;
    index index.php index.html index.htm;

    access_log /www/sites/www.cliniquedelight.com/log/access.log main;
    error_log  /www/sites/www.cliniquedelight.com/log/error.log;

    ssl_certificate     /www/sites/www.cliniquedelight.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/www.cliniquedelight.com/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Do NOT force HTTP->HTTPS here when Cloudflare SSL mode is Flexible
    # (that causes an infinite 301 loop). Prefer Cloudflare SSL = Full.
    # error_page 497 https://$host$request_uri;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ^~ /.well-known/ {
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ @wordpress;
    }
    location @wordpress {
        rewrite ^ /index.php?$args last;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi-php.conf;
        include fastcgi_params;
        set $real_script_name $fastcgi_script_name;
        set $path_info "";
        if ($fastcgi_script_name ~ "^(.+?\.php)(/.+)$") {
            set $real_script_name $1;
            set $path_info $2;
        }
        fastcgi_param SCRIPT_FILENAME $document_root$real_script_name;
        fastcgi_param SCRIPT_NAME $real_script_name;
        fastcgi_param PATH_INFO $path_info;
        # Tell WordPress the public site is HTTPS (Cloudflare terminates SSL)
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }
}

