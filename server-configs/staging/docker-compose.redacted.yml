# DN Apps local staging — mirrors production (app.doctornow.hk, WP 5.8, phlox-pro)
services:
  wordpress:
    image: wordpress:7.0.2-php8.2-apache
    container_name: dnapps_wp_local
    ports:
      - "8093:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: REDACTED
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_CONFIG_EXTRA: |
        define('DISABLE_WP_CRON', true);
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - ./wp-cli.phar:/usr/local/bin/wp:ro
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: dnapps_db_local
    environment:
      MYSQL_ROOT_PASSWORD: REDACTED
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: REDACTED
    volumes:
      - db_data:/var/lib/mysql
      - ./db-dumps:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  db_data:
